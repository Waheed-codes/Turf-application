<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueX - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <div class="page page-no-nav">
      <div class="login-page">
        <!-- Logo and Heading -->
        <div class="login-top">
          <div class="logo-grid">
            <div class="logo-square green"></div>
            <div class="logo-square"></div>
            <div class="logo-square"></div>
            <div class="logo-square"></div>
          </div>
          <div class="logo-text">VenueX</div>
          
          <h1>Book Any Venue</h1>
          <p class="login-subtitle">
            One platform to discover and book sports venues, event halls, conference rooms, studios, wedding venues, coworking spaces, and more.
          </p>
        </div>

        <!-- Form and Action Buttons -->
        <div class="login-form">
          <div class="input-group">
            <label for="phone-email">Phone Number or Email</label>
            <input type="text" id="phone-email" class="input-control" placeholder="Enter phone number or email" value="arjun.sharma@example.com">
          </div>
          
          <button id="main-login-btn" class="login-btn">
            Log In
          </button>
          
          <div class="login-divider">Or continue with</div>

          <div class="sso-buttons">
            <!-- Google Button -->
            <button class="sso-btn sso-trigger">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-.14 3.01-1.3 4.03v3.35h7.75c4.54-4.18 7.1-10.33 7.1-16.73z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.97-1.08 7.96-2.91l-7.75-3.35c-2.15 1.45-4.9 2.3-7.96 2.3-6.13 0-11.31-4.14-13.16-9.73H.1V13.8C2.08 17.7 6.13 24 12 24z"/>
                <path fill="#FBBC05" d="M3.24 13.82c-.47-1.42-.74-2.93-.74-4.5s.27-3.08.74-4.5V.26H.1A11.96 11.96 0 0 0 0 9.32c0 3.25.81 6.3 2.25 9L3.24 13.8z"/>
                <path fill="#EA4335" d="M12 2.3c1.76 0 3.35.6 4.6 1.8l3.43-3.43A11.92 11.92 0 0 0 12 0C6.13 0 2.08 6.3.1 10.2l3.24 4.5c1.85-5.59 7.03-9.73 13.16-9.73z"/>
              </svg>
              Continue with Google
            </button>
            
            <!-- Apple Button -->
            <button class="sso-btn apple sso-trigger">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.82M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.2.67-2.92 1.49-.62.71-1.16 1.85-1.02 2.96 1.11.09 2.24-.56 2.95-1.39z"/>
              </svg>
              Continue with Apple
            </button>
            
            <!-- Phone Button -->
            <button class="sso-btn sso-trigger">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                <line x1="12" y1="18" x2="12.01" y2="18"/>
              </svg>
              Continue with Phone Number
            </button>
          </div>
        </div>

        <!-- Footer -->
        <div class="login-bottom">
          <p class="login-link-text">
            Already have an account? <a href="#" id="login-link">Log In</a>
          </p>
          <p class="terms-policy-text">
            By continuing, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a>.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Custom login behavior
    const proceedToHome = (name = 'Arjun Sharma') => {
      appState.login(name);
      window.location.href = 'home.html';
    };

    // Attach click listeners to all buttons
    document.getElementById('main-login-btn').addEventListener('click', () => {
      const inputVal = document.getElementById('phone-email').value.trim();
      const name = inputVal ? inputVal.split('@')[0] : 'Arjun Sharma';
      // Capitalize name
      const cleanName = name.split('.').map(n => n.charAt(0).toUpperCase() + n.slice(1)).join(' ');
      proceedToHome(cleanName || 'Arjun Sharma');
    });

    document.querySelectorAll('.sso-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        proceedToHome('Arjun Sharma');
      });
    });

    document.getElementById('login-link').addEventListener('click', (e) => {
      e.preventDefault();
      proceedToHome('Arjun Sharma');
    });
  </script>
</body>
</html>
