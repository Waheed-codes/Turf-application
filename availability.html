<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueX - Availability</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Availability Page -->
    <div class="page page-no-nav">
      
      <!-- Header -->
      <header class="header" style="border-bottom: 1px solid var(--border-color);">
        <button class="icon-button" id="back-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="header-title-section" style="align-items: center; flex: 1; margin-right: 42px;">
          <span class="greeting-text">Step 2: Choose Field</span>
          <h2 class="user-name" style="font-size: 16px;">Ground Availability</h2>
        </div>
      </header>

      <!-- Selection Banner Info -->
      <div class="availability-header-info" id="draft-details-header">
        <div>Venue: <strong id="header-venue-name">Greenfield Sports Club</strong></div>
        <div>Schedule: <strong id="header-booking-schedule">Tmrw, Jul 17 | 05:00 AM - 11:00 AM (6h)</strong></div>
      </div>

      <!-- Grounds List Container -->
      <div class="grounds-list" id="grounds-container">
        <!-- JS dynamic grounds render -->
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let draft = null;

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Pull booking details from draft storage
      draft = appState.getBookingDraft();
      
      if (!draft || !draft.venueId) {
        alert('Booking draft expired. Please select details again.');
        window.location.href = 'home.html';
        return;
      }

      // Populate schedule display header
      document.getElementById('header-venue-name').textContent = draft.venueName;
      
      const dateText = formatters.formatShortDate(draft.date);
      const timeStart = formatters.formatTime12h(draft.startTime);
      const timeEnd = formatters.formatTime12h(draft.endTime);
      
      document.getElementById('header-booking-schedule').textContent = 
        `${dateText} | ${timeStart} - ${timeEnd} (${draft.duration} hours)`;

      // 2. Render grounds matching the venue category/ID
      renderGrounds();

      // 3. Back button
      document.getElementById('back-btn').addEventListener('click', () => {
        window.location.href = `venue-details.html?id=${draft.venueId}`;
      });
    });

    // Dynamic ground elements listing
    function renderGrounds() {
      const container = document.getElementById('grounds-container');
      const venueGrounds = GROUNDS[draft.venueId] || [];

      if (venueGrounds.length === 0) {
        container.innerHTML = `<div class="empty-state">No grounds configured for this venue.</div>`;
        return;
      }

      // Get appropriate image based on venue category
      const venueObj = VENUES.find(v => v.id === draft.venueId);
      const categoryImage = venueObj ? venueObj.image : 'assets/football_turf.png';

      container.innerHTML = venueGrounds.map(ground => {
        // Calculate ground specific total cost
        const groundTotal = bookingCalc.calculateTotal(ground.pricePerHour, draft.duration);
        const cardClass = ground.available ? '' : 'unavailable';
        const badgeText = ground.available ? 'Available' : 'Unavailable';
        const badgeClass = ground.available ? 'available' : 'unavailable';
        const btnText = ground.available ? 'Book Now' : 'Unavailable';
        const btnDisabled = ground.available ? '' : 'disabled';

        // Amenities html tags
        const amenitiesHtml = ground.amenities.map(am => {
          const icon = AMENITY_ICONS[am] || '✨';
          return `<span class="ground-amenity-tag">${icon} ${am}</span>`;
        }).join('');

        return `
          <div class="ground-card ${cardClass}">
            <div class="card-image-container" style="height: 130px;">
              <img class="ground-card-img" src="${categoryImage}" alt="${ground.name}">
              <span class="ground-card-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="ground-card-details">
              <div class="ground-card-title-row">
                <h3 class="ground-card-title">${ground.name}</h3>
              </div>
              
              <div class="ground-card-spec-row">
                <span class="ground-card-spec-item">Surface: <strong>${ground.surface}</strong></span>
                <span class="ground-card-spec-item">Max Capacity: <strong>${ground.capacity}</strong></span>
              </div>

              <!-- Amenities list tags -->
              <div class="ground-amenities">
                ${amenitiesHtml}
              </div>

              <div class="ground-card-footer">
                <div class="ground-price-col">
                  <span class="ground-price-label">Total Booking Fee</span>
                  <span class="ground-price-total">₹${groundTotal}</span>
                  <span class="ground-price-rate">₹${ground.pricePerHour}/hour</span>
                </div>
                <button class="book-now-btn ${btnDisabled}" onclick="confirmBooking('${ground.id}', '${ground.name}', ${ground.pricePerHour}, ${groundTotal})">
                  ${btnText}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Checkout final handler
    function confirmBooking(groundId, groundName, hourlyRate, totalPrice) {
      if (!draft) return;
      
      const newBooking = {
        venueId: draft.venueId,
        venueName: draft.venueName,
        groundId: groundId,
        groundName: groundName,
        date: draft.date,
        startTime: draft.startTime,
        endTime: draft.endTime,
        duration: draft.duration,
        hourlyRate: hourlyRate,
        totalPrice: totalPrice
      };

      // Add booking to user's bookings history
      const savedBooking = appState.addBooking(newBooking);

      // Save confirmation state for summary view
      localStorage.setItem('venuex_confirmed_booking', JSON.stringify(savedBooking));

      // Route to confirmation success screen
      window.location.href = 'confirmation.html';
    }
  </script>
</body>
</html>
