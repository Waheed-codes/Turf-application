<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueX - Home</title>
  <link rel="stylesheet" href="css/customer.css">
</head>
<body>
  <div class="app-container">
    
    <div class="top-nav">
      <div>
        <div style="font-size:12px; color:var(--text-sub); font-weight:600;">Location</div>
        <div style="font-size:16px; font-weight:700;">Hyderabad <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg></div>
      </div>
      <div class="icon-btn" id="profile-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>

    <div class="page">
      <div class="search-container">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search venues, sports...">
        </div>
      </div>

      <div class="categories-wrapper hide-scrollbar" id="categories-container">
        <!-- JS Populated -->
      </div>

      <div class="date-wrapper hide-scrollbar" id="date-container">
        <!-- JS Populated -->
      </div>

      <div class="time-wrapper">
        <select class="time-select" id="start-time-select">
          <option value="" disabled selected hidden>0:00</option>
          <!-- JS Populated -->
        </select>
        <select class="time-select" id="end-time-select" disabled>
          <option value="" disabled selected hidden>0:00</option>
          <!-- JS Populated -->
        </select>
      </div>

      <div style="padding: 0 calc(var(--spacing) * 3); margin-top: 16px;">
        <button class="btn btn-primary" id="find-venues-btn" disabled>Find Available Venues</button>
      </div>

      <div class="section-title" id="available-venues-title" style="margin-top:24px; display: none;">Available Venues</div>
      
      <div class="venue-list" id="venue-list" style="display: none;">
        <!-- JS Populated -->
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Home
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Bookings
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        Favorites
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </a>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/customer.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
