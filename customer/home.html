<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueX - Home</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Home Specific Styles */
    .search-container {
      padding: 0 calc(var(--spacing) * 3);
      margin-bottom: calc(var(--spacing) * 2);
    }
    .search-bar {
      display: flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0 16px;
      height: 48px;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
    }
    .search-bar:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(75, 85, 99, 0.1);
    }
    .search-bar svg {
      color: var(--text-muted);
      margin-right: 12px;
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }
    
    /* Category Chips */
    .categories-wrapper {
      padding: 0 calc(var(--spacing) * 3);
      margin-bottom: calc(var(--spacing) * 3);
      overflow-x: auto;
      display: flex;
      gap: 12px;
    }
    .category-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .category-chip:hover {
      border-color: var(--primary-light);
    }
    .category-chip.active {
      background-color: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }

    /* Venue Cards */
    .venue-list {
      padding: 0 calc(var(--spacing) * 3);
      display: flex;
      flex-direction: column;
      gap: calc(var(--spacing) * 3);
    }
    .venue-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }
    .venue-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .venue-img-wrapper {
      width: 100%;
      height: 180px;
      position: relative;
    }
    .venue-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      color: #FFF;
      backdrop-filter: blur(4px);
    }
    .status-available { background-color: var(--status-available); }
    .status-unavailable { background-color: var(--status-unavailable); }
    
    .fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-pill);
      background-color: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      color: var(--text-muted);
      transition: all var(--transition);
    }
    .fav-btn:hover {
      transform: scale(1.1);
    }
    .fav-btn.active {
      color: #EF4444;
    }
    .fav-btn.active svg {
      fill: #EF4444;
    }

    .venue-details {
      padding: 16px;
    }
    .venue-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .venue-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }
    .venue-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }
    .venue-rating svg {
      color: #FBBF24;
      fill: #FBBF24;
    }
    .venue-meta {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .venue-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .venue-price span {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div class="top-nav">
      <div>
        <div style="font-size:12px; color:var(--text-sub); font-weight:600;">Location</div>
        <div style="font-size:16px; font-weight:700;">Hyderabad <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg></div>
      </div>
      <div class="icon-btn" id="profile-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
    </div>

    <div class="page">
      <div class="search-container">
        <div class="search-bar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search venues, sports...">
        </div>
      </div>

      <div class="categories-wrapper hide-scrollbar" id="categories-container">
        <!-- JS Populated -->
      </div>

      <div class="section-title" style="margin-top:0;">Featured Venues</div>
      
      <div class="venue-list" id="venue-list">
        <!-- JS Populated -->
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Home
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Bookings
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        Favorites
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </a>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      appState.checkAuth();

      let activeCategory = 'all';

      const renderCategories = () => {
        const container = document.getElementById('categories-container');
        container.innerHTML = CATEGORIES.map(c => `
          <div class="category-chip ${c.id === activeCategory ? 'active' : ''}" data-id="${c.id}">
            ${c.icon} ${c.name}
          </div>
        `).join('');

        container.querySelectorAll('.category-chip').forEach(chip => {
          chip.addEventListener('click', (e) => {
            activeCategory = e.currentTarget.getAttribute('data-id');
            renderCategories();
            renderVenues();
          });
        });
      };

      const renderVenues = (searchQuery = '') => {
        const container = document.getElementById('venue-list');
        
        let filtered = VENUES.filter(v => {
          const matchCat = activeCategory === 'all' || v.category === activeCategory;
          const matchSearch = v.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              v.location.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div style="text-align:center; padding: 40px 0; color: var(--text-muted);">No venues found.</div>`;
          return;
        }

        container.innerHTML = filtered.map(v => {
          const isFav = appState.isFavorite(v.id);
          const badgeClass = v.availableToday ? 'status-available' : 'status-unavailable';
          const badgeText = v.availableToday ? 'Available Today' : 'Fully Booked';

          return `
            <div class="venue-card" onclick="window.location.href='venue-details.html?id=${v.id}'">
              <div class="venue-img-wrapper">
                <img class="venue-img" src="${v.image}" alt="${v.name}" loading="lazy">
                <div class="status-badge ${badgeClass}">${badgeText}</div>
                <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${v.id}" onclick="toggleFav(event, ${v.id})">
                  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                  </svg>
                </button>
              </div>
              <div class="venue-details">
                <div class="venue-header-row">
                  <div class="venue-name">${v.name}</div>
                  <div class="venue-rating">
                    <svg viewBox="0 0 24 24" width="14" height="14"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    ${v.rating}
                  </div>
                </div>
                <div class="venue-meta">${v.distance} &bull; ${v.location}</div>
                <div class="venue-price">₹${v.pricePerHour} <span>/ hour</span></div>
              </div>
            </div>
          `;
        }).join('');
      };

      window.toggleFav = (e, id) => {
        e.stopPropagation();
        const active = appState.toggleFavorite(id);
        const btn = e.currentTarget;
        if(active) btn.classList.add('active');
        else btn.classList.remove('active');
      };

      document.getElementById('search-input').addEventListener('input', (e) => {
        renderVenues(e.target.value);
      });

      renderCategories();
      renderVenues();
      
      document.getElementById('profile-btn').addEventListener('click', () => {
        appState.logout();
      });
    });
  </script>
</body>
</html>
