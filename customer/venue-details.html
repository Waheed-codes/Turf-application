<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueX - Venue Details</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Venue Hero */
    .hero {
      position: relative;
      width: 100%;
      height: 260px;
    }
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .nav-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
    }
    .circle-btn {
      width: 40px; height: 40px;
      border-radius: var(--radius-pill);
      background-color: rgba(255,255,255,0.95);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .circle-btn:hover { transform: scale(1.05); }
    .circle-btn.active svg { fill: #EF4444; color: #EF4444; }

    /* Venue Info */
    .venue-info {
      padding: 24px;
      background-color: var(--bg-page);
    }
    .v-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 8px;
    }
    .v-title {
      font-size: 24px; font-weight: 800; color: var(--text-main);
    }
    .v-rating {
      display: flex; align-items: center; gap: 4px;
      font-size: 14px; font-weight: 700;
    }
    .v-rating svg { fill: #FBBF24; color: #FBBF24; }
    .v-meta {
      font-size: 14px; color: var(--text-sub);
      margin-bottom: 24px;
    }

    /* Amenities */
    .amenities {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 32px;
    }
    .amenity {
      padding: 8px 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 500;
      color: var(--text-sub);
    }

    /* Booking Card */
    .booking-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-md);
      margin-bottom: 24px;
    }
    .b-title {
      font-size: 18px; font-weight: 700; margin-bottom: 16px;
    }

    /* Date Scroller */
    .date-scroll {
      display: flex; gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }
    .date-card {
      flex: 0 0 auto;
      width: 68px; height: 78px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .date-card .d-day {
      font-size: 13px; font-weight: 600; color: var(--text-sub);
      margin-bottom: 2px;
    }
    .date-card .d-num {
      font-size: 22px; font-weight: 800; color: var(--text-main);
    }
    .date-card:not(.disabled):hover { border-color: var(--primary-light); }
    .date-card.active {
      background-color: var(--primary);
      border-color: var(--primary);
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(75, 85, 99, 0.2);
    }
    .date-card.active .d-day, .date-card.active .d-num { color: #FFF; }
    .date-card.disabled {
      opacity: 0.5; background-color: var(--bg-page); cursor: not-allowed;
    }

    /* Time Dropdowns */
    .time-grid {
      display: grid; grid-template-columns: 1fr; gap: 16px;
      margin-bottom: 24px;
    }
    .time-label {
      font-size: 13px; font-weight: 600; color: var(--text-sub);
      margin-bottom: 8px; display: block;
    }
    .dropdown-wrapper { position: relative; }
    .dropdown-select {
      width: 100%; height: 52px;
      padding: 0 44px 0 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 500; color: var(--text-main);
      appearance: none; outline: none; cursor: pointer;
      transition: all var(--transition);
    }
    .dropdown-select:focus { border-color: var(--primary); }
    .dropdown-select:disabled { opacity: 0.6; cursor: not-allowed; }
    .dropdown-icon {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--text-muted);
    }

    /* Summary */
    .summary {
      background-color: var(--bg-page);
      border-radius: var(--radius-md);
      padding: 16px; margin-bottom: 24px;
      display: none;
    }
    .s-row {
      display: flex; justify-content: space-between;
      font-size: 14px; color: var(--text-sub); margin-bottom: 8px;
    }
    .s-row:last-child { margin-bottom: 0; }
    .s-total {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 18px; font-weight: 800; color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="page page-no-nav">
      
      <!-- Hero Image -->
      <div class="hero">
        <img id="v-img" src="" alt="Venue">
        <div class="nav-overlay">
          <button class="circle-btn" onclick="window.location.href='home.html'">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <button class="circle-btn" id="fav-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Info -->
      <div class="venue-info">
        <div class="v-header">
          <div class="v-title" id="v-title"></div>
          <div class="v-rating"><svg viewBox="0 0 24 24" width="16" height="16"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> <span id="v-rating"></span></div>
        </div>
        <div class="v-meta" id="v-meta"></div>

        <div class="amenities">
          <div class="amenity">🚿 Changing Rooms</div>
          <div class="amenity">🚗 Parking</div>
          <div class="amenity">💡 Floodlights</div>
        </div>

        <!-- Booking Box -->
        <div class="booking-card">
          <div class="b-title">Select Date</div>
          <div class="date-scroll hide-scrollbar" id="date-container">
            <!-- JS Populated -->
          </div>

          <div class="time-grid">
            <div>
              <label class="time-label">Start Time</label>
              <div class="dropdown-wrapper">
                <select id="start-time" class="dropdown-select">
                  <option value="">Select Start</option>
                  <!-- JS -->
                </select>
                <svg class="dropdown-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            <div>
              <label class="time-label">End Time</label>
              <div class="dropdown-wrapper">
                <select id="end-time" class="dropdown-select" disabled>
                  <option value="">Select End</option>
                  <!-- JS -->
                </select>
                <svg class="dropdown-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
          </div>

          <div class="summary" id="summary-box">
            <div class="s-row"><span>Date</span> <span id="sum-date" style="color:var(--text-main);font-weight:600;"></span></div>
            <div class="s-row"><span>Time</span> <span id="sum-time" style="color:var(--text-main);font-weight:600;"></span></div>
            <div class="s-row"><span>Duration</span> <span id="sum-duration" style="color:var(--text-main);font-weight:600;"></span></div>
            <div class="s-row s-total"><span>Total</span> <span id="sum-total"></span></div>
          </div>

          <button class="btn btn-primary" id="check-btn" disabled>Check Availability</button>
        </div>

      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id')) || 1;
      const venue = VENUES.find(v => v.id === id);

      if (!venue) {
        window.location.href = 'home.html';
        return;
      }

      // Populate venue details
      document.getElementById('v-img').src = venue.image;
      document.getElementById('v-title').textContent = venue.name;
      document.getElementById('v-rating').textContent = `${venue.rating} (${venue.reviews})`;
      document.getElementById('v-meta').innerHTML = `${venue.location} &bull; ₹${venue.pricePerHour}/hr`;

      const favBtn = document.getElementById('fav-btn');
      if (appState.isFavorite(venue.id)) favBtn.classList.add('active');
      favBtn.addEventListener('click', () => {
        const active = appState.toggleFavorite(venue.id);
        if(active) favBtn.classList.add('active');
        else favBtn.classList.remove('active');
      });

      // Date Logic
      let selectedDateStr = null;
      const dateContainer = document.getElementById('date-container');
      const today = new Date();
      let dateHtml = '';

      // Generate next 14 days
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);
        const iso = d.toISOString().split('T')[0];
        const dayStr = d.toLocaleDateString('en-US', { weekday: 'short' }); // Mon, Tue
        const numStr = d.getDate();
        
        dateHtml += `
          <div class="date-card" data-date="${iso}">
            <div class="d-day">${dayStr}</div>
            <div class="d-num">${numStr}</div>
          </div>
        `;
      }
      dateContainer.innerHTML = dateHtml;

      const dateCards = document.querySelectorAll('.date-card');
      dateCards.forEach(c => {
        c.addEventListener('click', () => {
          if (c.classList.contains('disabled')) return;
          dateCards.forEach(dc => dc.classList.remove('active'));
          c.classList.add('active');
          selectedDateStr = c.getAttribute('data-date');
          updateSummary();
        });
      });

      // Time Logic
      const startSelect = document.getElementById('start-time');
      const endSelect = document.getElementById('end-time');
      
      let startHtml = '<option value="">Select Start</option>';
      for (let i = 6; i <= 22; i++) {
        const val = i.toString().padStart(2, '0') + ':00';
        const display = formatters.formatTime12h(val);
        startHtml += `<option value="${val}">${display}</option>`;
      }
      startSelect.innerHTML = startHtml;

      startSelect.addEventListener('change', (e) => {
        const sVal = e.target.value;
        if (!sVal) {
          endSelect.innerHTML = '<option value="">Select End</option>';
          endSelect.disabled = true;
          updateSummary();
          return;
        }

        // Populate valid end times
        let endHtml = '<option value="">Select End</option>';
        for (let i = 7; i <= 23; i++) {
          const val = i.toString().padStart(2, '0') + ':00';
          if (val > sVal) {
            endHtml += `<option value="${val}">${formatters.formatTime12h(val)}</option>`;
          }
        }
        endSelect.innerHTML = endHtml;
        endSelect.disabled = false;
        updateSummary();
      });

      endSelect.addEventListener('change', updateSummary);

      const sumBox = document.getElementById('summary-box');
      const checkBtn = document.getElementById('check-btn');

      function updateSummary() {
        const s = startSelect.value;
        const e = endSelect.value;
        
        if (selectedDateStr && s && e) {
          const duration = bookingCalc.calculateDuration(s, e);
          const total = bookingCalc.calculateTotal(venue.pricePerHour, duration);
          
          document.getElementById('sum-date').textContent = formatters.formatFullDate(selectedDateStr);
          document.getElementById('sum-time').textContent = `${formatters.formatTime12h(s)} - ${formatters.formatTime12h(e)}`;
          document.getElementById('sum-duration').textContent = `${duration} hour${duration > 1 ? 's' : ''}`;
          document.getElementById('sum-total').textContent = `₹${total}`;
          
          sumBox.style.display = 'block';
          checkBtn.disabled = false;
        } else {
          sumBox.style.display = 'none';
          checkBtn.disabled = true;
        }
      }

      checkBtn.addEventListener('click', () => {
        const s = startSelect.value;
        const e = endSelect.value;
        if (!selectedDateStr || !s || !e) return;
        
        const draft = {
          venueId: venue.id,
          venueName: venue.name,
          date: selectedDateStr,
          startTime: s,
          endTime: e,
          duration: bookingCalc.calculateDuration(s, e),
          totalPrice: bookingCalc.calculateTotal(venue.pricePerHour, bookingCalc.calculateDuration(s, e)),
          hourlyRate: venue.pricePerHour
        };
        appState.saveBookingDraft(draft);
        window.location.href = 'availability.html';
      });
    });
  </script>
</body>
</html>
