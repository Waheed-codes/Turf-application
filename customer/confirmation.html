<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueX - Booking Confirmed</title>
  <link rel="stylesheet" href="css/customer.css">
</head>
<body>
  <div class="app-container">
    <div class="page page-no-nav conf-page" id="confirm-section">
      <h1 class="c-title">Review Booking</h1>
      <p class="c-sub">Please confirm your booking details.</p>
      
      <div class="confirm-details">
        <div class="cd-row"><span class="cd-label">Venue</span> <span class="cd-val" id="cd-venue"></span></div>
        <div class="cd-row"><span class="cd-label">Location</span> <span class="cd-val" id="cd-location"></span></div>
        <div class="cd-row"><span class="cd-label">Activity</span> <span class="cd-val" id="cd-activity"></span></div>
        <div class="cd-row"><span class="cd-label">Date</span> <span class="cd-val" id="cd-date"></span></div>
        <div class="cd-row"><span class="cd-label">Time</span> <span class="cd-val" id="cd-time"></span></div>
        <div class="cd-row"><span class="cd-label">Duration</span> <span class="cd-val" id="cd-duration"></span></div>
        <div class="cd-total"><span class="cd-label" style="color:var(--text-main);">Total Price</span> <span class="cd-val" id="cd-total"></span></div>
      </div>
      
      <button class="btn btn-primary home-btn" id="confirm-booking-btn">Confirm Booking</button>
      <button class="btn home-btn" style="background:transparent; color:var(--text-sub); margin-top:12px; border:none; box-shadow:none;" onclick="window.location.href='home.html'">Cancel</button>
    </div>

    <div class="page page-no-nav conf-page hidden" id="success-section">
      
      <div class="success-icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1 class="c-title">Booking Confirmed!</h1>
      <p class="c-sub">Your slot has been successfully reserved.</p>

      <div class="ticket">
        <div class="t-row"><span class="t-label">Venue</span> <span class="t-val" id="t-venue"></span></div>
        <div class="t-row"><span class="t-label">Date</span> <span class="t-val" id="t-date"></span></div>
        <div class="t-row"><span class="t-label">Time</span> <span class="t-val" id="t-time"></span></div>

        <div class="t-total-row">
          <span class="t-label">Total Paid</span>
          <span class="t-val" id="t-total"></span>
        </div>
      </div>

      <button class="btn btn-primary home-btn" onclick="window.location.href='home.html'">Back to Dashboard</button>
      
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/customer.js"></script>
  <script src="js/confirmation.js"></script>
</body>
</html>
