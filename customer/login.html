<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VenueX - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page {
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      background-color: var(--bg-card); /* White */
    }
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background-color: var(--primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      font-size: 32px;
      font-weight: 800;
    }
    .login-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 8px;
    }
    .login-subtitle {
      font-size: 15px;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 48px;
    }
    
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 52px;
      border-radius: var(--radius-xl);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--bg-card);
      color: var(--text-main);
      margin-bottom: 16px;
      transition: all var(--transition);
    }
    .social-btn:hover {
      background-color: var(--bg-page);
      transform: scale(0.98);
    }
    .social-icon {
      width: 20px;
      height: 20px;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--border);
      margin: 0 16px;
    }

    .phone-btn {
      background-color: var(--primary);
      color: #FFF;
      border: none;
    }
    .phone-btn:hover {
      background-color: var(--primary-dark);
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="page page-no-nav login-page">
      <div class="logo-container">
        <div class="logo-icon">VX</div>
      </div>
      <h1 class="login-title">Welcome to VenueX</h1>
      <p class="login-subtitle">Find and book the best sports venues around you.</p>

      <button class="social-btn" id="google-btn">
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">or</div>

      <button class="social-btn phone-btn" id="phone-btn">
        <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Continue with Phone Number
      </button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const handleLogin = () => {
        appState.login();
        window.location.href = 'home.html';
      };
      
      document.getElementById('google-btn').addEventListener('click', handleLogin);
      document.getElementById('phone-btn').addEventListener('click', handleLogin);
    });
  </script>
</body>
</html>
